name: Banking LLM Lab
on:
  push:
    paths: ['src/**', 'tests/TaskApi.Tests/**', '.github/workflows/banking-llm.yml']
  pull_request:
    paths: ['src/**', 'tests/TaskApi.Tests/**', '.github/workflows/banking-llm.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/TaskApi.Tests/TaskApi.Tests.csproj --configuration Release
